spring.application.name=stockflow

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
spring.datasource.username=${DB_USER:stockflow}
spring.datasource.password=${DB_PASSWORD:stockflow}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.data.web.pageable.page-parameter=pagina
spring.data.web.pageable.size-parameter=tamano
spring.data.web.pageable.max-page-size=100
spring.data.web.sort.sort-parameter=orden

springdoc.swagger-ui.path=/swagger-ui.html
